[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kairos"
version = "0.1.0"
description = "Regime-aware portfolio intelligence"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dynamic = ["dependencies"]

[project.scripts]
kairos = "kairos.pipeline:main"

[tool.setuptools.dynamic]
dependencies = { file = ["infrastructure/requirements.txt"] }

[tool.setuptools.packages.find]
where = ["code"]
include = ["kairos*"]

[tool.pytest.ini_options]
testpaths = ["code/tests"]
pythonpath = ["code"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["code"]
extend-exclude = ["notebooks"]

[tool.ruff.lint.isort]
known-first-party = ["kairos", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B905"]

[tool.ruff.lint.per-file-ignores]
"code/kairos/**/models/lstm_numpy.py" = ["N803", "N806"]

[tool.mypy]
python_version = "3.11"
mypy_path = "code"
packages = ["kairos"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
no_implicit_optional = true
