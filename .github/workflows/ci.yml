name: ci
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: infrastructure/requirements-dev.txt
      - run: pip install -r infrastructure/requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check code scripts
      - run: mypy
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: infrastructure/requirements.txt
      - run: pip install -r infrastructure/requirements.txt
      - run: python -m pytest -q
